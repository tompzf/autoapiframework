#
# TEMPLATE - Component Specification File (*.acs)
#
# Copy this file, rename it to <YourFunctionName>.acs and fill it in.
# Every "row" below is one signal/parameter/runnable and MUST provide exactly
# one value per entry listed under "columns", in the same order.
# Remove this header and all "# <-- ..." hints once the file is filled in.

functionSpecification:
  name: <YourFunctionName>              # e.g. SpeedHazardDetection
  version: 1.0.0                        # semantic version of this function specification
  metaModelRef:
    name: Eclipse-autoapiframework-Metamodel
    version: 0.4.0                      # meta model version this file was written against

  description: >-
    <One or two sentences describing what this function does.>

  # -----------------------------------------------------------------------
  # 1) DATA INTERFACES: one object per input/output signal.
  #    - direction: input | output
  #    - FuSa: true | false
  #    - ASIL: QM | A | B | C | D
  #    - protection: none | complement | other
  #    - qualityCode is runtime companion information and therefore is not a
  #      static metadata value in this specification.
  # -----------------------------------------------------------------------
  dataInterfaces:
    - name: Vehicle.<Domain>.<Signal>
      direction: input
      dataType: float
      description: <Functional meaning of the signal.>
      unit: <unit>
      min: <min>
      max: <max>
      defaultValue: <defaultValue>
      resolution: <resolution>
      precision: <precision>
      FuSa: true
      ASIL: QM
      minUpdatePeriodMs: <minUpdatePeriodMs>
      accuracy: <expected accuracy>
      protection: none

    # - name: Vehicle.<Domain>.<OutputSignal>
    #   direction: output
    #   dataType: float
    #   description: <Functional meaning of the output signal.>
    #   unit: <unit>
    #   min: <min>
    #   max: <max>
    #   defaultValue: <defaultValue>
    #   resolution: <resolution>
    #   precision: <precision>
    #   FuSa: false
    #   ASIL: QM
    #   minUpdatePeriodMs: <minUpdatePeriodMs>
    #   accuracy: <expected accuracy>
    #   protection: none

  # -----------------------------------------------------------------------
  # 2) PARAMETERS: one object per calibration/configuration value.
  # -----------------------------------------------------------------------
  parameters:
    - name: Vehicle.<Domain>.<Parameter>
      dataType: float
      defaultValue: <defaultValue>
      description: <Meaning and intended usage of the parameter.>
      unit: <unit>
      tunable: false
      min: <min>
      max: <max>

  # -----------------------------------------------------------------------
  # 3) SCHEDULING: one object per runnable/function entry point.
  #    - runType: init | cyclic | event | terminate
  #    - Naming convention: <FunctionName>.Init / .Step / .Terminate
  #    - previousRunnableRef: name of the runnable that must run right before
  #      this one (use System.Startup for the very first runnable).
  # -----------------------------------------------------------------------
  scheduling:
    - functionName: <YourFunctionName>.Init
      runType: init
      description: <Initialize internal states.>
      cycleTimeMs: 0
      implementedASIL: QM
      previousRunnableRef: System.Startup
      supervision:
        required: false

    - functionName: <YourFunctionName>.Step
      runType: cyclic
      description: <Evaluate inputs and calculate outputs.>
      cycleTimeMs: <cycleTimeMs>
      implementedASIL: QM
      previousRunnableRef: <YourFunctionName>.Init
      supervision:
        required: false

    - functionName: <YourFunctionName>.Terminate
      runType: terminate
      description: <Shutdown cleanup.>
      cycleTimeMs: 0
      implementedASIL: QM
      previousRunnableRef: <YourFunctionName>.Step
      supervision:
        required: false
