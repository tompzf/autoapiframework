functionSpecification:
  name: VehicleSpeedFusion
  version: 1.0.0
  metaModelRef:
    name: Eclipse-autoapiframework-Metamodel
    version: 0.4.0

  description: >-
    Fuses wheel-speed and GNSS speed sources into one stable vehicle speed
    output using a two-rate cyclic execution model.

  dataInterfaces:
    - name: Vehicle.WheelBasedSpeed
      direction: input
      dataType: float
      description: Wheel-based vehicle speed estimate.
      unit: km/h
      min: 0.0
      max: 320.0
      defaultValue: 0.0
      resolution: 0.1
      precision: 1
      FuSa: true
      ASIL: B
      minUpdatePeriodMs: 10
      accuracy: "+/-0.3 km/h"
      protection: complement

    - name: Vehicle.GNSS.SpeedOverGround
      direction: input
      dataType: float
      description: GNSS speed estimate used as a secondary source.
      unit: km/h
      min: 0.0
      max: 320.0
      defaultValue: 0.0
      resolution: 0.1
      precision: 1
      FuSa: false
      ASIL: QM
      minUpdatePeriodMs: 100
      accuracy: "+/-1.0 km/h"
      protection: none

    - name: Vehicle.WheelBasedSpeed.Qualifier
      direction: input
      dataType: uint8
      description: Runtime quality qualifier for wheel-based speed.
      unit: code
      min: 0
      max: 5
      defaultValue: 0
      resolution: 1
      precision: 1
      FuSa: false
      ASIL: QM
      minUpdatePeriodMs: 10
      accuracy: enum-based
      protection: none

    - name: Vehicle.Speed
      direction: output
      dataType: float
      description: Fused vehicle speed output for downstream consumers.
      unit: km/h
      min: 0.0
      max: 320.0
      defaultValue: 0.0
      resolution: 0.1
      precision: 1
      FuSa: true
      ASIL: B
      minUpdatePeriodMs: 20
      accuracy: "+/-0.5 km/h"
      protection: complement

  parameters:
    - name: Vehicle.SpeedFusion.Alpha
      dataType: float
      defaultValue: 0.7
      description: Weight of wheel-speed contribution in fusion.
      unit: ratio
      tunable: false
      min: 0.0
      max: 1.0

    - name: Vehicle.SpeedFusion.MaxDeltaPerStep
      dataType: float
      defaultValue: 5.0
      description: Maximum allowed output change per 20 ms cycle.
      unit: km/h
      tunable: false
      min: 0.0
      max: 100.0

  scheduling:
    - functionName: VehicleSpeedFusion.Init
      runType: init
      description: Initialize filter states and fallback defaults.
      cycleTimeMs: 0
      implementedASIL: B
      previousRunnableRef: System.Startup
      supervision:
        required: false

    - functionName: VehicleSpeedFusion.PreProcess
      runType: cyclic
      description: >-
        10 ms cyclic runnable that validates inputs, applies plausibility checks,
        and updates intermediate state.
      cycleTimeMs: 10
      implementedASIL: B
      previousRunnableRef: VehicleSpeedFusion.Init
      supervision:
        required: false

    - functionName: VehicleSpeedFusion.Step
      runType: cyclic
      description: >-
        20 ms cyclic runnable that performs source fusion and publishes Vehicle.Speed.
      cycleTimeMs: 20
      implementedASIL: B
      previousRunnableRef: VehicleSpeedFusion.PreProcess
      supervision:
        required: false

    - functionName: VehicleSpeedFusion.Terminate
      runType: terminate
      description: Release resources and set deterministic safe defaults.
      cycleTimeMs: 0
      implementedASIL: QM
      previousRunnableRef: VehicleSpeedFusion.Step
      supervision:
        required: false
